<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#ffffff"/>
  <!-- same atom, scaled to 80% so round Android masks never clip it -->
  <g transform="translate(256 256) scale(.8) translate(-256 -256)">
    <g fill="none" stroke-width="20">
      <ellipse cx="256" cy="256" rx="190" ry="70" stroke="#2563eb"/>
      <ellipse cx="256" cy="256" rx="190" ry="70" stroke="#f59e0b" transform="rotate(60 256 256)"/>
      <ellipse cx="256" cy="256" rx="190" ry="70" stroke="#0f172a" transform="rotate(-60 256 256)"/>
    </g>
    <circle cx="256" cy="256" r="38" fill="#ffc53d"/>
    <circle cx="446" cy="256" r="20" fill="#2563eb"/>
  </g>
</svg>
