<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="Arial, sans-serif" font-size="14">
  <rect width="480" height="300" fill="#ffffff"/>
  <!-- grid -->
  <g stroke="#e3e7f0" stroke-width="1">
    <line x1="60" y1="50" x2="440" y2="50"/><line x1="60" y1="100" x2="440" y2="100"/><line x1="60" y1="200" x2="440" y2="200"/><line x1="60" y1="250" x2="440" y2="250"/>
    <line x1="132" y1="40" x2="132" y2="260"/><line x1="204" y1="40" x2="204" y2="260"/><line x1="276" y1="40" x2="276" y2="260"/><line x1="348" y1="40" x2="348" y2="260"/>
  </g>
  <!-- axes: time axis through v = 0 -->
  <g stroke="#141b30" stroke-width="2" fill="none">
    <line x1="60" y1="150" x2="450" y2="150"/><line x1="60" y1="270" x2="60" y2="30"/>
  </g>
  <polygon points="450,145 460,150 450,155" fill="#141b30"/>
  <polygon points="55,30 60,20 65,30" fill="#141b30"/>
  <!-- labels -->
  <g fill="#141b30" text-anchor="middle">
    <text x="132" y="168">1</text><text x="204" y="168">2</text><text x="276" y="168">3</text><text x="348" y="168">4</text>
    <text x="455" y="140">t / s</text>
  </g>
  <g fill="#141b30" text-anchor="end">
    <text x="52" y="55">10</text><text x="52" y="105">5</text><text x="52" y="155">0</text><text x="52" y="205">−5</text><text x="52" y="255">−10</text>
  </g>
  <text x="70" y="22" fill="#141b30">v / m s⁻¹</text>
  <!-- graph -->
  <line x1="60" y1="50" x2="348" y2="250" stroke="#0a6fa8" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="204" cy="150" r="5" fill="#0a6fa8"/>
  <text x="214" y="140" fill="#5b6480" font-size="13">X</text>
</svg>
